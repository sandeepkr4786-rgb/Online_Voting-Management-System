{% extends "base.html" %}

{% block title %}Voter Verification &bull; {{ question }}{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="card">
        <div class="auth-header">
            <div class="auth-icon">🪪</div>
            <h2>Voter Verification</h2>
            <p>Electoral roll verification for: <strong>{{ question }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('voter_details', poll_id=poll_id) }}" class="styled-form">
            <div class="form-group">
                <label for="voter_id">Voter ID / EPIC Number <span class="required">*</span></label>
                <input type="text" id="voter_id" name="voter_id" required placeholder="e.g. VOTER001, IND12345" value="{{ session.get('voter_id', '') }}">
                <small class="field-hint">Enter your unique government or election voter identification number.</small>
            </div>

            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Your full name as per electoral roll">
            </div>

            <div class="form-group">
                <label for="age">Age (Must be 18+) <span class="required">*</span></label>
                <input type="number" id="age" name="age" min="18" max="120" required placeholder="18">
            </div>

            <div class="form-group">
                <label for="address">Constituency / Residential Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your residential address"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block btn-lg">Verify &amp; Proceed to Vote &rarr;</button>
            </div>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('home') }}" class="link">&larr; Back to Active Polls</a>
        </div>
    </div>
</div>
{% endblock %}
